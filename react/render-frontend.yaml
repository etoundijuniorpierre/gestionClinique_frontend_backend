services:
  # Service Frontend React
  - type: web
    name: gestion-clinique-frontend
    env: static
    plan: free
    buildCommand: "npm run build"
    publishPath: "./build"
    
    # Variables d'environnement
    envVars:
      - key: REACT_APP_API_BASE
        value: https://gestion-clinique-backend.onrender.com
      - key: GENERATE_SOURCEMAP
        value: false
    
    # ✅ DÉPLOIEMENT AUTOMATIQUE
    autoDeploy: true
    branch: prod
    
    # Health check
    healthCheckPath: /
    
    # Ressources
    resources:
      memory: 256Mi
      cpu: 0.1

  # Service Backend Spring Boot
  - type: web
    name: gestion-clinique-backend
    env: docker
    dockerfilePath: ./springBoot/Dockerfile
    plan: free
    
    # Variables d'environnement
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: CORS_ALLOWED_ORIGINS
        value: https://gestion-clinique-frontend.onrender.com
    
    # ✅ DÉPLOIEMENT AUTOMATIQUE
    autoDeploy: true
    branch: prod
    
    # Health check
    healthCheckPath: /actuator/health
    
    # Ressources
    resources:
      memory: 512Mi
      cpu: 0.25
