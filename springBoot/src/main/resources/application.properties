spring.application.name=GestionClinique
spring.docker.compose.enabled=false
server.port=${PORT:2025}

# PostgreSQL datasource disabled - using MongoDB instead
spring.datasource.url=${SPRING_DATASOURCE_URL:}
# spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
# spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
# spring.datasource.driver-class-name=org.postgresql.Driver

# MongoDB Atlas Configuration
#spring.data.mongodb.uri=${MONGODB_URI:mongodb+srv://user:password@cluster.mongodb.net/clinique}
#spring.data.mongodb.database=${MONGODB_DATABASE:clinique}

# JPA configuration disabled - using MongoDB instead
# spring.jpa.database=postgresql
# spring.jpa.show-sql=${SHOW_SQL:false}
# spring.jpa.hibernate.ddl-auto=update
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
debug=${DEBUG_MODE: false}

# application.properties
logging.level.com.example.GestionClinique=DEBUG
logging.level.org.springframework.aop=DEBUG
spring.main.allow-circular-references=true

# ✅ Configuration CORS pour Render
spring.web.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://gestion-clinique-frontend.onrender.com,http://localhost:3000}
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# ✅ Configuration Actuator pour Health Checks
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.health.defaults.enabled=true

# config upload photoProfil
# Dossier où stocker les photos
file.storage.directory=src/main/uploads/profilsUser

# Taille max en octets (ex: 2Mo = 2 * 1024 * 1024)
file.max-size=104971520

# For Spring Boot 2.x & 3.x
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

# Extensions autorisées (séparées par virgule)
file.allowed-extensions=.jpg,.jpeg,.png,.gif
