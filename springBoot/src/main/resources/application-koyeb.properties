# Koyeb profile - optimized for production deployment

# Database - uses Koyeb PostgreSQL service
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=${JWT_SECRET}

# Production optimizations
spring.main.allow-circular-references=true

# File upload - use database storage with 1MB limit
file.max-size=1048576
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=1MB
file.allowed-extensions=.jpg,.jpeg,.png,.gif

# Actuator for health checks
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Production logging
logging.level.com.example.GestionClinique=WARN
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN

# Performance tuning
server.tomcat.max-threads=200
server.tomcat.connection-timeout=20000
server.tomcat.max-connections=8192
