# Render profile - uses H2 embedded database for simplicity

# H2 Database configuration
spring.datasource.url=jdbc:h2:mem:clinique;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA configuration for H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Enable H2 console (optional, for debugging)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT
jwt.secret=${JWT_SECRET:your-secret-key-change-this-in-production-min-256-bits}

# Remove circular ref warning
spring.main.allow-circular-references=true

# File upload - use temp directory for Render
file.storage.directory=/tmp/uploads/profilsUser
file.max-size=104971520
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB
file.allowed-extensions=.jpg,.jpeg,.png,.gif

# Actuator for health checks
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Production logging
logging.level.com.example.GestionClinique=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
