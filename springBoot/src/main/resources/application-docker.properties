spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=${JWT_SECRET:your-secret-key-change-this-in-production-min-256-bits}

# Remove circular ref warning
spring.main.allow-circular-references=true

# File upload - use absolute path for Docker
file.storage.directory=uploads/profilsUser
file.max-size=104971520
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB
file.allowed-extensions=.jpg,.jpeg,.png,.gif

# Actuator for health check
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
