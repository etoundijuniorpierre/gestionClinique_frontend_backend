name: Deploy to Render

on:
  push:
    branches: [ main, master ]  # Déclenche sur chaque push vers main/master
  pull_request:
    branches: [ main, master ]  # Déclenche sur chaque PR

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Login to Docker Hub (optionnel)
      if: github.event_name == 'push'
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
        
    - name: Build and push Docker image
      if: github.event_name == 'push'
      run: |
        docker buildx build --platform linux/amd64,linux/arm64 -t ${{ secrets.DOCKER_USERNAME }}/gestion-clinique-backend:latest --push .
        
    - name: Deploy to Render
      if: github.event_name == 'push'
      run: |
        # Trigger Render deployment via webhook
        curl -X POST \
          -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
          -H "Content-Type: application/json" \
          -d '{"serviceId": "${{ secrets.RENDER_SERVICE_ID }}"}' \
          https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys
          
    - name: Notify deployment
      if: github.event_name == 'push'
      run: |
        echo "🚀 Deployment triggered successfully!"
        echo "📊 Commit: ${{ github.sha }}"
        echo "🌐 Branch: ${{ github.ref_name }}"
        echo "👤 Author: ${{ github.actor }}"
