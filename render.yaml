services:
  # --------------------------------------------------------------------------
  # BACKEND : Web Service (Docker)
  # --------------------------------------------------------------------------
  - type: web
    name: gestion-clinique-backend
    env: docker
    plan: free
    region: frankfurt # Plus proche pour de meilleures performances
    dockerContext: ./springBoot
    dockerfilePath: ./springBoot/Dockerfile
    healthCheckPath: /actuator/health
    branch: prod2
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: render
      - key: CORS_ALLOWED_ORIGINS
        value: https://gestion-clinique-frontend.onrender.com
      - key: JAVA_OPTS
        # ⚡️ ACCÉLÈRE LE DÉMARRAGE SUR RENDER FREE ⚡️
        # Désactive la compilation tiercée lourde et limite la mémoire
        value: "-XX:TieredStopAtLevel=1 -Xmx384m -Djava.security.egd=file:/dev/./urandom"

  # --------------------------------------------------------------------------
  # FRONTEND : Static Site (Le plus rapide et gratuit)
  # --------------------------------------------------------------------------
  - type: web
    name: gestion-clinique-frontend
    env: static
    plan: free
    buildCommand: "cd react && npm install && npm run build"
    publishPath: "react/build"
    branch: prod2
    autoDeploy: true
    # Redirection nécessaire pour React Router (SPA)
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_API_BASE
        value: https://gestion-clinique-backend.onrender.com
