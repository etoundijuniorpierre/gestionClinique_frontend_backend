services:
  # --------------------------------------------------------------------------
  # BACKEND : Web Service (Docker)
  # --------------------------------------------------------------------------
  - type: web
    name: gestion-clinique-backend
    runtime: docker
    plan: free
    region: frankfurt
    branch: prod2
    rootDir: springBoot
    dockerfilePath: Dockerfile
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: render
      - key: CORS_ALLOWED_ORIGINS
        value: https://gestion-clinique-frontend.onrender.com
      - key: JAVA_TOOL_OPTIONS
        value: "-XX:TieredStopAtLevel=1 -Xmx384m -Djava.security.egd=file:/dev/./urandom"

  # --------------------------------------------------------------------------
  # FRONTEND : Static Site
  # --------------------------------------------------------------------------
  - type: web
    name: gestion-clinique-frontend
    runtime: static
    branch: prod2
    rootDir: react
    buildCommand: npm install && npm run build
    staticPublishPath: ./build
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_API_BASE
        value: https://gestion-clinique-backend.onrender.com
